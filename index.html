      <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-mono">Authentic Match Kits...</p>

  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // অনলাইন লোগো ও হেল্পলাইন
    const STORE_LOGO = "https://i.postimg.cc/NG7PBFVc/logo-png.png";
    const OWNER_WHATSAPP_NUMBER = "8801326126287";
    const DISPLAY_WHATSAPP = "01326126287";
    const PAYMENT_NUMBER = "01767323641";
    // অপ্টিমাইজড ও ফাস্ট লোডিং ছবি
    const HERO_DISPLAY_JERSEYS_IMG = "https://images.unsplash.com/photo-1649771543751-051019fb0093?auto=format&fit=crop&w=1000&q=75";

    const SECRET_ADMIN_USERNAME = "admin";
    const SECRET_ADMIN_PASSWORD = "@650@gmail";

    const SUPABASE_URL = "https://gwpvnguajzrpbuixxdwn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3cHZuZ3VhanpycGJ1aXh4ZHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTM5MzcsImV4cCI6MjEwODY4OTkzN30.r2hOUKGGbXXWiPOnyxr8x-YG4bssW8OkB7C5Roqc_EQ";

    let supabaseClient = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {}

    const ALL_SIZES = ["S", "M", "L", "XL", "XXL"];

    const CATEGORIES = [
      { id: 'All', en: 'All Kits', bn: 'সকল জার্সি' },
      { id: 'Club', en: 'Club Kits', bn: 'ক্লাব জার্সি' },
      { id: 'National', en: 'National Kits', bn: 'জাতীয় দল' },
      { id: 'Retro', en: 'Retro Classics', bn: 'রেট্রো কালেকশন' },
      { id: 'Player Edition', en: 'Player Edition', bn: 'প্লেয়ার এডিশন' },
      { id: 'Fan Edition', en: 'Fan Edition', bn: 'ফ্যান এডিশন' }
    ];

    const initialFallbackJerseys = [
      { id: "1", sku: "JA-RM-24", title_bn: "রিয়াল মাদ্রিদ হোম কিট ২৪/২৫", title_en: "Real Madrid Home Kit 24/25", category: "Player Edition", price: 1150, compare_price: 1400, stock: 15, is_out_of_stock: false, sizes: ALL_SIZES, image: "https://images.unsplash.com/photo-1577212017184-80cc0da11082?auto=format&fit=crop&w=600&q=75", description_bn: "১০০% প্রিমিয়াম থাই পলিয়েস্টার, ব্রিদেবল হিট-প্রেসড লোগো ও আসল প্লেয়ার ফিটিং।" },
      { id: "2", sku: "JA-ARG-24", title_bn: "আর্জেন্টিনা কোপা উইনার জার্সি", title_en: "Argentina Champions Kit", category: "Fan Edition", price: 1050, compare_price: 1300, stock: 20, is_out_of_stock: false, sizes: ALL_SIZES, image: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=600&q=75", description_bn: "৩ তারকা খচিত চ্যাম্পিয়ন ব্যাজ সহ প্রিমিয়াম আরামদায়ক ড্রি-ফিট ফেব্রিক।" },
      { id: "3", sku: "JA-MU-08", title_bn: "ম্যানচেস্টার ইউনাইটেড ২০০৮ রেট্রো", title_en: "Manchester United 2008 Retro", category: "Retro", price: 1250, compare_price: 1600, stock: 8, is_out_of_stock: false, sizes: ALL_SIZES, image: "https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=600&q=75", description_bn: "আইকনিক মস্কো ফাইনাল এমব্রয়ডারি খচিত নিখুঁত ক্লাসিক অ্যান্টিক কিট।" },
      { id: "4", sku: "JA-BAR-25", title_bn: "বার্সেলোনা ১২৫ বছর বার্ষিকী কিট", title_en: "FC Barcelona 125th Kit", category: "Club", price: 1100, compare_price: 1350, stock: 12, is_out_of_stock: false, sizes: ALL_SIZES, image: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=600&q=75", description_bn: "স্পেশাল হাফ-হাফ ভিন্টেজ শেড ও ব্রিদেবল এয়ার-ফ্লো ডিজাইন।" }
    ];

    // পারসিস্টেন্স ও লোকাল স্টোরেজ হেল্পার
    const getDeletedProductIds = () => {
      try {
        const stored = localStorage.getItem('jerseyadda_deleted_ids');
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    };

    const addDeletedProductId = (id) => {
      try {
        const current = getDeletedProductIds();
        const updated = [...new Set([...current, String(id)])];
        localStorage.setItem('jerseyadda_deleted_ids', JSON.stringify(updated));
      } catch (e) {}
    };

    const getLocalAddedProducts = () => {
      try {
        const stored = localStorage.getItem('jerseyadda_local_products');
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    };

    const saveLocalAddedProducts = (prods) => {
      try {
        localStorage.setItem('jerseyadda_local_products', JSON.stringify(prods));
      } catch (e) {}
    };

    const parseSizes = (s) => (Array.isArray(s) && s.length > 0 ? s : ALL_SIZES);

    const parseOrderItems = (raw) => {
      try {
        const p = JSON.parse(raw);
        if (Array.isArray(p)) return p;
      } catch (e) {}
      return [{ title_bn: String(raw), size: 'M', quantity: 1, price: 0 }];
    };

    const matchesCategory = (prod, catId) => {
      if (!catId || catId === 'All') return true;

      const pCat = String(prod.category || '').toLowerCase().trim();
      const pEdition = String(prod.edition || '').toLowerCase().trim();
      const pTitleBn = String(prod.title_bn || '').toLowerCase();
      const pTitleEn = String(prod.title_en || '').toLowerCase();
      const pDesc = String(prod.description_bn || '').toLowerCase();
      const target = String(catId).toLowerCase().trim();

      if (pCat === target || pEdition === target) return true;

      if (target === 'player edition' || target.includes('player')) {
        return (
          pCat.includes('player') || pEdition.includes('player') ||
          pTitleBn.includes('প্লেয়ার') || pTitleBn.includes('player') ||
          pTitleEn.includes('player') || pDesc.includes('player')
        );
      }

      if (target === 'fan edition' || target.includes('fan')) {
        return (
          pCat.includes('fan') || pEdition.includes('fan') ||
          pTitleBn.includes('ফ্যান') || pTitleBn.includes('fan') ||
          pTitleEn.includes('fan') || pDesc.includes('fan')
        );
      }

      if (target === 'retro' || target.includes('retro')) {
        return (
          pCat.includes('retro') || pEdition.includes('retro') ||
          pTitleBn.includes('রেট্রো') || pTitleBn.includes('retro') ||
          pTitleEn.includes('retro') || pDesc.includes('retro')
        );
      }

      if (target === 'national' || target.includes('national')) {
        return (
          pCat.includes('national') || pCat.includes('জাতীয়') ||
          pTitleBn.includes('জাতীয়') || pTitleBn.includes('আর্জেন্টিনা') ||
          pTitleBn.includes('ব্রাজিল') || pTitleBn.includes('জার্মানি') ||
          pTitleBn.includes('পর্তুগাল') || pTitleEn.includes('national') ||
          pTitleEn.includes('argentina') || pTitleEn.includes('brazil')
        );
      }

      if (target === 'club' || target.includes('club')) {
        return (
          pCat.includes('club') || pCat.includes('ক্লাব') ||
          pTitleBn.includes('মাদ্রিদ') || pTitleBn.includes('বার্সেলোনা') ||
          pTitleBn.includes('ইউনাইটেড') || pTitleBn.includes('আর্সেনাল') ||
          pTitleBn.includes('সিটি') || pTitleBn.includes('ক্লাব') ||
          pTitleEn.includes('club') || pTitleEn.includes('madrid') ||
          pTitleEn.includes('barcelona') || pTitleEn.includes('united')
        );
      }

      return pCat.includes(target);
    };

    function App() {
      // ডিফল্টভাবে প্রথমে ইংরেজি থাকবে
      const [lang, setLang] = useState('en');
      const [view, setView] = useState('home');

      const [products, setProducts] = useState(() => {
        const deletedIds = getDeletedProductIds();
        const localAdded = getLocalAddedProducts().filter(p => !deletedIds.includes(String(p.id)));
        const baseFiltered = initialFallbackJerseys.filter(p => !deletedIds.includes(String(p.id)));
        return [...localAdded, ...baseFiltered];
      });

      const [cart, setCart] = useState([]);
      const [ordersList, setOrdersList] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [isMobileSearchOpen, setIsMobileSearchOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('All');

      const mobileSearchInputRef = useRef(null);

      const [selectedProduct, setSelectedProduct] = useState(null);
      const [selectedSize, setSelectedSize] = useState('M');
      const [productQuantity, setProductQuantity] = useState(1);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [directItem, setDirectItem] = useState(null);

      const [hasCustomPrint, setHasCustomPrint] = useState(false);
      const [customName, setCustomName] = useState('');
      const [customNumber, setCustomNumber] = useState('');

      const [showSizeModal, setShowSizeModal] = useState(false);
      const [modalTab, setModalTab] = useState('calculator');
      const [fitEdition, setFitEdition] = useState('fan');
      const [fitChest, setFitChest] = useState(40);
      const [logoFailed, setLogoFailed] = useState(false);

      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
      const [adminInputUsername, setAdminInputUsername] = useState('');
      const [adminInputPassword, setAdminInputPassword] = useState('');
      const [adminLoginError, setAdminLoginError] = useState('');
      const [adminTab, setAdminTab] = useState('products');
      const [showAddProductForm, setShowAddProductForm] = useState(false);

      const [newProdData, setNewProdData] = useState({
        title_bn: '',
        title_en: '',
        category: 'Club',
        price: '',
        compare_price: '',
        stock: '15',
        sku: '',
        image: '',
        description_bn: ''
      });

      const [toastMsg, setToastMsg] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [confirmedOrder, setConfirmedOrder] = useState(null);

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); };

      const [customerProfile, setCustomerProfile] = useState(() => {
        try {
          const s = localStorage.getItem('jerseyadda_profile');
          return s ? JSON.parse(s) : { name: '', phone: '', zone: 'inside_dhaka', address: '' };
        } catch (e) {
          return { name: '', phone: '', zone: 'inside_dhaka', address: '' };
        }
      });
      const [profileTab, setProfileTab] = useState('details');

      const [checkoutForm, setCheckoutForm] = useState({
        name: customerProfile.name || '',
        phone: customerProfile.phone || '',
        zone: customerProfile.zone || 'inside_dhaka',
        address: customerProfile.address || '',
        paymentMethod: 'Nagad',
        senderNumber: '',
        trxId: ''
      });

      const handleSearchChange = (val) => {
        const clean = val.trim();
        if (clean === SECRET_ADMIN_PASSWORD || clean.toLowerCase() === 'admin') {
          setSearchQuery('');
          setShowAdminLoginModal(true);
          return;
        }
        setSearchQuery(val);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        setAdminLoginError('');
        if (adminInputUsername.trim() === SECRET_ADMIN_USERNAME && adminInputPassword.trim() === SECRET_ADMIN_PASSWORD) {
          setIsAdminAuthenticated(true);
          setShowAdminLoginModal(false);
          setAdminInputUsername('');
          setAdminInputPassword('');
          setView('admin');
          showToast(lang === 'en' ? 'Welcome to Secret Admin Panel!' : 'সিক্রেট অ্যাডমিন প্যানেলে স্বাগতম!');
        } else {
          setAdminLoginError(lang === 'en' ? 'Invalid Username or Password!' : 'ভুল ইউজারনেম অথবা পাসওয়ার্ড!');
        }
      };

      useEffect(() => {
        const fetchLiveProducts = async () => {
          const deletedIds = getDeletedProductIds();
          const localAdded = getLocalAddedProducts().filter(p => !deletedIds.includes(String(p.id)));

          if (!supabaseClient) return;
          try {
            const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
            if (!error && data && data.length > 0) {
              const liveFiltered = data
                .filter(p => !deletedIds.includes(String(p.id)))
                .map(p => ({ 
                  ...p, 
                  sizes: parseSizes(p.sizes),
                  is_out_of_stock: p.is_out_of_stock ?? (Number(p.stock) <= 0)
                }));

              const liveIds = new Set(liveFiltered.map(p => String(p.id)));
              const extraLocal = localAdded.filter(p => !liveIds.has(String(p.id)));

              setProducts([...extraLocal, ...liveFiltered]);
            }
          } catch (e) {}
        };
        fetchLiveProducts();

        const fetchUserOrders = async () => {
          if (!supabaseClient) return;
          try {
            const { data } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            if (data) setOrdersList(data);
          } catch (e) {}
        };
        fetchUserOrders();

        const handleKeyDown = (e) => {
          if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
            e.preventDefault();
            setShowAdminLoginModal(true);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const activeItems = directItem ? [directItem] : cart;
      const subtotal = activeItems.reduce((sum, item) => sum + (Number(item.price) * item.quantity), 0);
      const deliveryFee = checkoutForm.zone === 'inside_dhaka' ? 70 : 130;
      const totalAmount = subtotal + deliveryFee;
      const cartCount = cart.reduce((sum, i) => sum + i.quantity, 0);

      const isProductOutOfStock = (p) => {
        return Boolean(p.is_out_of_stock) || Number(p.stock) <= 0;
      };

      const handleAddNewProductSubmit = async (e) => {
        e.preventDefault();
        if (!newProdData.title_bn || !newProdData.price || !newProdData.image) {
          alert(lang === 'en' ? 'Please fill Jersey Name, Price and Image URL!' : 'অনুগ্রহ করে জার্সির নাম, মূল্য এবং ছবির লিঙ্ক দিন!');
          return;
        }

        const newId = `kit_${Date.now()}`;
        const generatedSku = newProdData.sku.trim() || `JA-${Math.floor(1000 + Math.random() * 9000)}`;
        const stockQty = Number(newProdData.stock) || 15;

        const newKit = {
          id: newId,
          sku: generatedSku,
          title_bn: newProdData.title_bn.trim(),
          title_en: newProdData.title_en.trim() || newProdData.title_bn.trim(),
          category: newProdData.category,
          price: Number(newProdData.price),
          compare_price: newProdData.compare_price ? Number(newProdData.compare_price) : null,
          stock: stockQty,
          is_out_of_stock: stockQty <= 0,
          sizes: ALL_SIZES,
          image: newProdData.image.trim(),
          description_bn: newProdData.description_bn.trim() || "১০০% প্রিমিয়াম থাই পলিয়েস্টার, নিখুঁত ফিনিশিং।"
        };

        const currentLocal = getLocalAddedProducts();
        saveLocalAddedProducts([newKit, ...currentLocal]);

        if (supabaseClient) {
          try {
            await supabaseClient.from('products').insert([newKit]);
          } catch (err) {}
        }

        setProducts(prev => [newKit, ...prev]);
        showToast(lang === 'en' ? 'New Jersey added successfully! ⚽' : 'নতুন জার্সি সফলভাবে যোগ হয়েছে! ⚽');
        setNewProdData({
          title_bn: '',
          title_en: '',
          category: 'Club',
          price: '',
          compare_price: '',
          stock: '15',
          sku: '',
          image: '',
          description_bn: ''
        });
        setShowAddProductForm(false);
      };

      const handleDeleteProduct = async (id, title) => {
        const confirmMsg = lang === 'en' ? `Are you sure you want to permanently delete "${title}"?` : `আপনি কি নিশ্চিতভাবে "${title}" জার্সিটি মুছে ফেলতে চান?`;
        if (!window.confirm(confirmMsg)) return;

        addDeletedProductId(id);

        const updatedLocal = getLocalAddedProducts().filter(p => String(p.id) !== String(id));
        saveLocalAddedProducts(updatedLocal);

        if (supabaseClient) {
          try {
            await supabaseClient.from('products').delete().eq('id', id);
          } catch (err) {}
        }

        setProducts(prev => prev.filter(p => String(p.id) !== String(id)));
        if (selectedProduct && String(selectedProduct.id) === String(id)) {
          setSelectedProduct(null);
          setView('home');
        }
        showToast(lang === 'en' ? `"${title}" deleted permanently! 🗑️` : `"${title}" চিরতরে মুছে ফেলা হয়েছে! 🗑️`);
      };

      const handleToggleProductStock = async (prod) => {
        const currentlyOutOfStock = isProductOutOfStock(prod);
        const nextOutOfStock = !currentlyOutOfStock;
        const nextStockNum = nextOutOfStock ? 0 : 20;

        if (supabaseClient) {
          try {
            await supabaseClient.from('products').update({
              is_out_of_stock: nextOutOfStock,
              stock: nextStockNum
            }).eq('id', prod.id);
          } catch (err) {}
        }

        setProducts(prev => prev.map(p => {
          if (String(p.id) === String(prod.id)) {
            return {
              ...p,
              is_out_of_stock: nextOutOfStock,
              stock: nextStockNum
            };
          }
          return p;
        }));

        if (selectedProduct && String(selectedProduct.id) === String(prod.id)) {
          setSelectedProduct(prev => ({
            ...prev,
            is_out_of_stock: nextOutOfStock,
            stock: nextStockNum
          }));
        }

        showToast(nextOutOfStock ? (lang === 'en' ? 'Marked as Sold Out!' : 'স্টক আউট করা হয়েছে!') : (lang === 'en' ? 'Restocked! ✨' : 'ইন-স্টক করা হয়েছে! ✨'));
      };

      const handleCalculateSmartChestSize = (e) => {
        e.preventDefault();
        const chest = Number(fitChest) || 40;
        let rec = 'M';
        if (fitEdition === 'player') {
          if (chest <= 36) rec = 'S'; else if (chest <= 38) rec = 'M'; else if (chest <= 40) rec = 'L'; else if (chest <= 42) rec = 'XL'; else rec = 'XXL';
        } else {
          if (chest <= 38) rec = 'S'; else if (chest <= 40) rec = 'M'; else if (chest <= 42) rec = 'L'; else if (chest <= 44) rec = 'XL'; else rec = 'XXL';
        }
        setSelectedSize(rec);
        setShowSizeModal(false);
        showToast(lang === 'en' ? `Best fit for chest (${chest}"): Size ${rec}` : `বুকের মাপে (${chest} ইঞ্চি) সেরা সাইজ: ${rec}`);
      };

      const handleAddToCart = (product, size, qty = 1) => {
        if (isProductOutOfStock(product)) {
          alert(lang === 'en' ? 'Sorry, this kit is currently out of stock!' : 'দুঃখিত, এই জার্সিটি বর্তমানে স্টক আউট!');
          return;
        }
        const itemSize = size || 'M';
        const itemPrice = hasCustomPrint ? Number(product.price) + 150 : Number(product.price);
        const printText = hasCustomPrint && customName ? `${customName.toUpperCase()} #${customNumber || '00'}` : null;
        const key = `${product.id}_${itemSize}_${printText || 'standard'}`;

        setCart(prev => {
          const idx = prev.findIndex(item => item.cartKey === key);
          if (idx > -1) {
            return prev.map((item, i) => i === idx ? { ...item, quantity: item.quantity + qty } : item);
          } else {
            return [...prev, { ...product, price: itemPrice, cartKey: key, size: itemSize, quantity: qty, customPrint: printText }];
          }
        });
        setDirectItem(null);
        setIsCartOpen(true);
        showToast(lang === 'en' ? 'Kit added to your bag!' : 'জার্সি ব্যাগে যুক্ত হয়েছে!');
      };

      const handleUpdateCartQty = (cartKey, delta) => {
        setCart(prev => prev.map(item => item.cartKey === cartKey ? { ...item, quantity: item.quantity + delta } : item).filter(item => item.quantity > 0));
      };

      const handleRemoveCartItem = (cartKey) => {
        setCart(prev => prev.filter(item => item.cartKey !== cartKey));
      };

      const handleOpenDetail = (prod) => {
        setSelectedProduct(prod);
        setSelectedSize('M');
        setProductQuantity(1);
        setHasCustomPrint(false);
        setCustomName('');
        setCustomNumber('');
        setFitEdition(prod.category === 'Player Edition' ? 'player' : 'fan');
        setView('product-detail');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDirectOrder = () => {
        if (isProductOutOfStock(selectedProduct)) {
          alert(lang === 'en' ? 'Sorry, this kit is currently out of stock!' : 'দুঃখিত, এই জার্সিটি বর্তমানে স্টক আউট!');
          return;
        }
        const itemPrice = hasCustomPrint ? Number(selectedProduct.price) + 150 : Number(selectedProduct.price);
        const printText = hasCustomPrint && customName ? `${customName.toUpperCase()} #${customNumber || '00'}` : null;
        setDirectItem({
          id: selectedProduct.id, title_bn: selectedProduct.title_bn, title_en: selectedProduct.title_en,
          price: itemPrice, quantity: productQuantity, size: selectedSize || 'M', image: selectedProduct.image,
          sku: selectedProduct.sku, customPrint: printText
        });
        setView('checkout');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        try {
          localStorage.setItem('jerseyadda_profile', JSON.stringify(customerProfile));
          showToast(lang === 'en' ? 'Information saved successfully!' : 'তথ্য সফলভাবে সেভ হয়েছে!');
          setCheckoutForm(prev => ({ ...prev, ...customerProfile }));
        } catch (err) {}
      };

      const handleConfirmOrderAndSendWhatsApp = async (e) => {
        e.preventDefault();
        if (activeItems.length === 0) return;
        if (!checkoutForm.senderNumber || !checkoutForm.trxId) {
          alert(lang === 'en' ? 'Please provide Payment Number and TrxID!' : 'অনুগ্রহ করে পেমেন্ট নম্বর এবং TrxID দিন!');
          return;
        }

        setIsSubmitting(true);
        const orderId = `JA-${Math.floor(100000 + Math.random() * 900000)}`;
        const zoneText = checkoutForm.zone === 'inside_dhaka' ? 'ঢাকার ভেতরে (২৪-৪৮ ঘণ্টা)' : 'ঢাকার বাইরে (২৪-৭২ ঘণ্টা)';
        const orderData = {
          order_number: orderId, customer_name: checkoutForm.name, phone: checkoutForm.phone,
          zone: zoneText, address: checkoutForm.address, delivery_fee: deliveryFee, cod_amount: subtotal, total: totalAmount,
          payment_method: checkoutForm.paymentMethod, sender_number: checkoutForm.senderNumber, trx_id: checkoutForm.trxId,
          items: JSON.stringify(activeItems), status: 'Pending Verification', created_at: new Date().toISOString()
        };

        if (supabaseClient) {
          try {
            await supabaseClient.from('orders').insert([orderData]);
            await supabaseClient.from('customers').insert([{ name: checkoutForm.name, phone: checkoutForm.phone, address: checkoutForm.address, zone: checkoutForm.zone }]);
          } catch (err) {}
        }

        let itemsText = "";
        activeItems.forEach((it, idx) => {
          const printNote = it.customPrint ? ` (প্রিন্ট: ${it.customPrint})` : '';
          const nameToDisplay = lang === 'en' ? (it.title_en || it.title_bn) : it.title_bn;
          itemsText += `${idx + 1}. ${nameToDisplay} [${it.size}] x${it.quantity} - ৳${it.price * it.quantity}${printNote}\n`;
        });

        const rawWhatsAppMsg = `⚽ *নতুন অর্ডার — জার্সি আড্ডা*\n------------------------------------\n📌 আইডি: #${orderId}\n👤 নাম: ${checkoutForm.name}\n📞 ফোন: ${checkoutForm.phone}\n📍 ঠিকানা: ${checkoutForm.address} (${orderData.zone})\n\n📦 জার্সি সমূহ:\n${itemsText}\n💰 পেমেন্ট:\n• মোট জার্সি: ৳${subtotal}\n• ডেলিভারি ফি (পেইড): ৳${deliveryFee} (${checkoutForm.paymentMethod})\n• প্রেরক: ${checkoutForm.senderNumber}\n• TrxID: ${checkoutForm.trxId}\n🔥 ক্যাশ অন ডেলিভারি বাকি: ৳${subtotal}\n------------------------------------\nঅর্ডারটি দ্রুত প্রস্তুত করুন!`;
        const whatsappUrl = `https://wa.me/${OWNER_WHATSAPP_NUMBER}?text=${encodeURIComponent(rawWhatsAppMsg)}`;

        setConfirmedOrder({ ...orderData, whatsappUrl });
        setOrdersList(prev => [orderData, ...prev]);
        setCart([]);
        setDirectItem(null);
        setIsSubmitting(false);
        setView('success');
        window.open(whatsappUrl, '_blank');
      };

      const handleToggleOrderStatus = async (orderNum, currentStatus) => {
        const nextStatus = currentStatus === 'Approved' ? 'Pending Verification' : 'Approved';
        if (supabaseClient) {
          try {
            await supabaseClient.from('orders').update({ status: nextStatus }).eq('order_number', orderNum);
          } catch (e) {}
        }
        setOrdersList(ordersList.map(o => o.order_number === orderNum ? { ...o, status: nextStatus } : o));
        showToast(`Order #${orderNum} status updated!`);
      };

      const filteredProducts = products.filter(p => {
        const matchesCat = matchesCategory(p, selectedCategory);
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q || 
          (p.title_bn && p.title_bn.toLowerCase().includes(q)) || 
          (p.title_en && p.title_en.toLowerCase().includes(q)) ||
          (p.sku && p.sku.toLowerCase().includes(q));

                <input

                  <span className={lang === 'bn' ? 'text-sky-600 font-extrabold' : 'text-slate-400'}>বাং</span>
                </button>

                <button 
                  onClick={() => {
                    setIsMobileSearchOpen(!isMobileSearchOpen);
                    setTimeout(() => mobileSearchInputRef.current?.focus(), 100);

                <button onClick={() => setView('home')} className={`hidden sm:inline-block text-xs font-bold px-3 py-1.5 rounded-full ${view === 'home' ? 'bg-[#0B1E36] text-white' : 'text-slate-600'}`}>
                  {lang === 'en' ? 'Home' : 'হোম'}

                <button onClick={() => setView('profile')} className={`hidden sm:inline-block text-xs font-bold px-3 py-1.5 rounded-full ${view === 'profile' ? 'bg-[#0B1E36] text-white' : 'প্রোফাইল'}`}>

                {isAdminAuthenticated && (
                  <button onClick={() => setView('admin')} className="bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded-full text-[10px] sm:text-xs">👑 Staff Panel</button>
                )}

                <button onClick={() => setIsCartOpen(true)} className="relative p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition flex items-center justify-center">
                  <span className="text-sm">🛒</span>
                  {cartCount > 0 && <span className="absolute -top-1 -right-1 bg-theme-accent text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center shadow-sm">{cartCount}</span>}

            {isMobileSearchOpen && (

                <div className="relative">
                  <input

                    type="text"
                    placeholder={lang === 'en' ? 'Search kit, club or country...' : 'পছন্দের ক্লাব বা দেশের জার্সি খুঁজুন...'}

                    onChange={(e) => handleSearchChange(e.target.value)}
                    className="w-full bg-slate-100 border border-slate-300 rounded-xl py-2 pl-9 pr-9 text-xs focus:outline-none focus:border-theme-accent"
                  />
                  <span className="absolute left-3 top-2.5 text-slate-400 text-xs">🔍</span>
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-3 top-2.5 text-xs text-slate-400 font-bold">✕</button>
                  )}
                </div>
              </div>
            )}
          </header>

          <main className="flex-1 w-full max-w-full">
            {view === 'home' && (

                  <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-10 lg:gap-12 items-center relative z-10">
                    <div className="lg:col-span-7 space-y-3.5 sm:space-y-5 text-center lg:text-left">
                      <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-sky-300 text-[10px] sm:text-xs font-bold tracking-widest uppercase shadow-sm">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        AUTHENTIC KITS 2026
                      </div>

                            {lang === 'en' ? 'Happy Fans' : 'হ্যাপি ফ্যানস'}
                          </span>
                        </div>
                        <div className="bg-white/5 border border-white/10 p-2 sm:p-3 rounded-xl sm:rounded-2xl backdrop-blur-md">
                          <strong className="font-sport text-base sm:text-xl text-emerald-400 block leading-tight">100%</strong>

                            {lang === 'en' ? 'Thai Polyester' : 'থাই পলিয়েস্টার'}

                      <div className="pt-2 flex flex-wrap gap-2.5 sm:gap-3.5 justify-center lg:justify-start">
                        <a href="#collection" className="bg-gradient-to-r from-sky-500 to-sky-600 hover:from-sky-600 hover:to-sky-700 text-white px-5 sm:px-7 py-2.5 sm:py-3.5 rounded-xl text-xs font-bold uppercase tracking-wider shadow-lg shadow-sky-500/25 transition">

                          {lang === 'en' ? '💬 WhatsApp Help' : '💬 WhatsApp হেল্প'}
                        </a>

                    <div className="lg:col-span-5 relative mt-2 lg:mt-0">
                      <div className="relative mx-auto max-w-sm sm:max-w-md lg:max-w-none rounded-2xl sm:rounded-3xl p-2 sm:p-3 bg-gradient-to-tr from-white/20 via-sky-500/10 to-white/5 border border-white/20 shadow-2xl backdrop-blur-md group">
                        <div className="relative aspect-[16/11] rounded-xl sm:rounded-2xl overflow-hidden bg-slate-950">
                          <img src={HERO_DISPLAY_JERSEYS_IMG} alt="Stadium Dressing Room Kits" loading="lazy" decoding="async" className="w-full h-full object-cover object-center filter brightness-[0.95] contrast-[1.08] group-hover:scale-105 transition duration-700" />

                <div id="collection" className="max-w-7xl mx-auto px-3.5 sm:px-4 py-6 sm:py-10">

                      <h3 className="font-sport text-xl sm:text-3xl font-bold text-theme-navy">

                        <div key={prod.id} onClick={() => handleOpenDetail(prod)} className="bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-theme-accent hover:shadow-xl cursor-pointer group transition duration-300 shadow-sm relative">

                        <button type="button" onClick={() => setCustomerProfile({ ...customerProfile, zone: 'outside_dhaka' })} className={`p-2.5 sm:p-3 border rounded-xl font-bold text-left transition ${customerProfile.zone === 'outside_dhaka' ? 'bg-theme-navy border-theme-navy text-white shadow-md' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>

                          const isApproved = ord.status === 'Approved';

                                </div>
                              </div>
                            </div>

                      লগআউট
                    </button>
                  </div>
                </div>

                    <span>👕</span><span>প্রোডাক্ট ম্যানেজমেন্ট ({products.length})</span>
                  </button>
                  <button

                    <span>📦</span><span>অর্ডার তালিকা ({ordersList.length})</span>

                      </div>
                      <button

                              <option value="Player Edition">প্লেয়ার এডিশন (Player Edition)</option>

                              type="number"

                            />

                            onChange={(e) => setNewProdData({ ...newProdData, description_bn: e.target.value })} 
                            className="w-full border p-2.5 rounded-xl text-xs bg-slate-50 focus:bg-white"

                        </div>

                          <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl shadow transition">
                            💾 জার্সি সেভ ও পাবলিশ করুন
                          </button>
                          <button type="button" onClick={() => setShowAddProductForm(false)} className="bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-bold">
                            বাতিল
                          </button>
                        </div>
                      </form>
                    )}

                      <div className="p-4 border-b bg-slate-50 flex justify-between items-center">

                        <span className="text-[11px] text-slate-500">এক ক্লিকেই পার্মানেন্ট ডিলিট ও স্টক পরিবর্তন সুবিধা</span>

                              <th className="p-3">মূল্য</th>
                              <th className="p-3 text-center">স্টক স্ট্যাটাস (ইন/আউট)</th>
                              <th className="p-3 text-right">অ্যাকশন</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {products.map((prod) => {
                              const out = isProductOutOfStock(prod);
                              return (

                                  <td className="p-3">

                                  </td>
                                  <td className="p-3">
                                    <span className="bg-sky-50 text-sky-800 border border-sky-200 font-bold px-2 py-0.5 rounded-md text-[10px]">
                                      {prod.category}
                                    </span>
                                  </td>
                                  <td className="p-3 font-sport text-sm font-bold text-theme-navy">
                                    ৳{prod.price}
                                    {prod.compare_price && <span className="line-through text-slate-400 text-[10px] font-normal ml-1">৳{prod.compare_price}</span>}
                                  </td>
                                  <td className="p-3 text-center">
                                    <button 
                                      onClick={() => handleToggleProductStock(prod)}
                                      className={`px-3 py-1.5 rounded-xl font-bold text-[11px] shadow-sm transition flex items-center justify-center gap-1.5 mx-auto ${out ? 'bg-red-100 text-red-700 hover:bg-red-200 border border-red-300' : 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200 border border-emerald-300'}`}
                                      title="ক্লিক করে স্টক ইন বা আউট করুন"
                                    >
                                      <span>{out ? '🔴 স্টক আউট' : '🟢 ইন স্টক'}</span>
                                      <span className="text-[9px] underline opacity-75">(ক্লিক টু পরিবর্তন)</span>
                                    </button>
                                  </td>
                                  <td className="p-3 text-right">
                                    <div className="flex items-center justify-end gap-1.5">
                                      <button 
                                        onClick={() => handleOpenDetail(prod)}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-bold text-[11px]"
                                        title="প্রোডাক্ট প্রিভিউ"
                                      >
                                        ভিউ 👁️
                                      </button>
                                      <button 
                                        onClick={() => handleDeleteProduct(prod.id, prod.title_bn)}
                                        className="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1.5 rounded-lg font-bold text-[11px] shadow-sm transition"
                                        title="স্থায়ীভাবে মুছে ফেলুন"
                                      >
                                        ডিলিট 🗑️
                                      </button>
                                    </div>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {adminTab === 'orders' && (
                  <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto shadow-sm">
                    <div className="p-4 border-b bg-slate-50 flex justify-between items-center">
                      <h3 className="font-bold text-sm text-theme-navy">গ্রাহকদের অর্ডার তালিকা ({ordersList.length})</h3>
                      <span className="text-[11px] text-slate-500">অনলাইন ও ক্যাশ অন ডেলিভারি ট্র্যাকিং</span>
                    </div>
                    <table className="w-full text-left min-w-[650px]">
                      <thead className="bg-slate-100 text-slate-700 uppercase text-[10px] font-bold border-b">
                        <tr><th className="p-3">অর্ডার আইডি</th><th className="p-3">গ্রাহক ও ফোন</th><th className="p-3">পেমেন্ট ও TrxID</th><th className="p-3">ক্যাশ অন ডেলিভারি</th><th className="p-3">অ্যাকশন</th></tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {ordersList.map((ord, idx) => (
                          <tr key={idx} className="hover:bg-slate-50">
                            <td className="p-3 font-mono font-bold">#{ord.order_number}</td>
                            <td className="p-3"><p className="font-bold">{ord.customer_name}</p><p className="font-mono text-[11px] text-slate-600">{ord.phone}</p></td>
                            <td className="p-3">{ord.payment_method} ({ord.sender_number})<br/><strong className="text-emerald-600 font-mono">{ord.trx_id}</strong></td>
                            <td className="p-3 font-sport text-sm font-bold text-emerald-700">৳{ord.cod_amount || ord.subtotal}</td>
                            <td className="p-3">
                              <button onClick={() => handleToggleOrderStatus(ord.order_number, ord.status)} className={`px-3 py-1 text-white rounded-lg font-bold text-xs ${ord.status === 'Approved' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-slate-800 hover:bg-slate-900'}`}>
                                {ord.status === 'Approved' ? '✓ Approved' : 'Approve করুন'}
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

              </div>
            )}
          </main>

          {showAdminLoginModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 flex items-center justify-center p-4">
              <div className="bg-white max-w-sm w-full rounded-3xl p-6 border border-slate-200 space-y-3 text-xs shadow-2xl">
                <h3 className="font-sport text-xl font-bold text-theme-navy">STAFF SECRET ACCESS</h3>
                {adminLoginError && <p className="text-red-600">{adminLoginError}</p>}
                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <input type="text" placeholder="admin" value={adminInputUsername} onChange={(e) => setAdminInputUsername(e.target.value)} className="w-full p-2.5 border rounded-xl" />
                  <input type="password" placeholder="পাসওয়ার্ড" value={adminInputPassword} onChange={(e) => setAdminInputPassword(e.target.value)} className="w-full p-2.5 border rounded-xl" />
                  <button type="submit" className="w-full bg-[#0B1E36] text-white py-3 rounded-xl font-bold uppercase tracking-wider">
                    {lang === 'en' ? 'Login' : 'লগইন'}
                  </button>
                  <button type="button" onClick={() => setShowAdminLoginModal(false)} className="w-full text-slate-500 py-1">
                    {lang === 'en' ? 'Cancel' : 'বাতিল'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {showSizeModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white max-w-md w-full rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 border shadow-2xl relative text-xs max-h-[85vh] overflow-y-auto">
                <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto mb-3 sm:hidden"></div>
                <button onClick={() => setShowSizeModal(false)} className="absolute top-4 right-4 font-bold text-lg">✕</button>
                <h3 className="font-sport text-xl font-bold text-theme-navy mb-2">CHEST SIZE GUIDE (S - XXL)</h3>
                <div className="flex gap-2 p-1 bg-slate-100 rounded-xl mb-3 font-bold">
                  <button onClick={() => setModalTab('calculator')} className={`flex-1 py-1.5 rounded-lg ${modalTab === 'calculator' ? 'bg-white shadow' : ''}`}>
                    {lang === 'en' ? 'Calculator' : 'ক্যালকুলেটর'}
                  </button>
                  <button onClick={() => setModalTab('chart')} className={`flex-1 py-1.5 rounded-lg ${modalTab === 'chart' ? 'bg-white shadow' : ''}`}>
                    {lang === 'en' ? 'Size Chart' : 'চার্ট টেবিল'}
                  </button>
                </div>
                {modalTab === 'calculator' ? (
                  <form onSubmit={handleCalculateSmartChestSize} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <button type="button" onClick={() => setFitEdition('fan')} className={`p-2 border rounded-xl font-bold ${fitEdition === 'fan' ? 'bg-theme-navy text-white' : ''}`}>Fan / Retro Edition</button>
                      <button type="button" onClick={() => setFitEdition('player')} className={`p-2 border rounded-xl font-bold ${fitEdition === 'player' ? 'bg-theme-navy text-white' : ''}`}>Player Edition</button>
                    </div>
                    <div>
                      <div className="flex justify-between mb-1 font-bold">
                        <span>{lang === 'en' ? 'Chest Size:' : 'বুকের মাপ:'}</span>
                        <span className="text-theme-accent">{fitChest} {lang === 'en' ? 'Inches' : 'ইঞ্চি'}</span>
                      </div>
                      <input type="range" min="34" max="48" value={fitChest} onChange={(e) => setFitChest(Number(e.target.value))} className="w-full accent-theme-accent" />
                    </div>
                    <button type="submit" className="w-full bg-theme-navy text-white py-2.5 rounded-xl font-bold uppercase">
                      {lang === 'en' ? 'Confirm Size' : 'সাইজ কনফার্ম করুন'}
                    </button>
                  </form>
                ) : (
                  <table className="w-full text-center border">
                    <thead className="bg-slate-100 font-bold border-b">
                      <tr><th className="p-2">{lang === 'en' ? 'Size' : 'সাইজ'}</th><th className="p-2 border-l">Player</th><th className="p-2 border-l">Fan/Retro</th></tr>
                    </thead>
                    <tbody className="divide-y">
                      <tr><td className="p-1.5 font-bold">S</td><td className="p-1.5 border-l">36"</td><td className="p-1.5 border-l">38"</td></tr>
                      <tr><td className="p-1.5 font-bold">M</td><td className="p-1.5 border-l">38"</td><td className="p-1.5 border-l">40"</td></tr>
                      <tr><td className="p-1.5 font-bold">L</td><td className="p-1.5 border-l">40"</td><td className="p-1.5 border-l">42"</td></tr>
                      <tr><td className="p-1.5 font-bold">XL</td><td className="p-1.5 border-l">42"</td><td className="p-1.5 border-l">44"</td></tr>
                      <tr><td className="p-1.5 font-bold">XXL</td><td className="p-1.5 border-l">44"</td><td className="p-1.5 border-l">46"</td></tr>
                    </tbody>
                  </table>
                )}
              </div>
            </div>
          )}

          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-6 sm:pl-10">
                <div className="w-screen max-w-md bg-white border-l p-4 sm:p-5 text-xs flex flex-col justify-between shadow-2xl">
                  <div>
                    <div className="flex justify-between items-center border-b pb-3 mb-4">
                      <h3 className="font-sport text-lg font-bold">YOUR BAG ({cartCount})</h3>
                      <button onClick={() => setIsCartOpen(false)} className="font-bold text-base p-1">✕</button>
                    </div>
                    <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                      {cart.map((item, idx) => (
                        <div key={item.cartKey || idx} className="flex gap-2.5 bg-slate-50 p-3 rounded-2xl border items-center justify-between">
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="text-[10px] font-bold text-slate-400">#{idx+1}</span>
                            <img src={item.image} alt={item.title_bn} className="w-10 h-12 object-cover rounded-lg border flex-shrink-0" />
                            <div className="min-w-0">
                              <h4 className="font-bold truncate text-xs">{lang === 'en' ? (item.title_en || item.title_bn) : item.title_bn}</h4>
                              <p className="text-[10px] text-slate-500 font-bold">Size: {item.size} {item.customPrint && `(${item.customPrint})`}</p>
                              <strong className="text-theme-navy">৳{item.price * item.quantity}</strong>
                            </div>
                          </div>
                          <div className="flex items-center gap-1.5 flex-shrink-0">
                            <button onClick={() => handleUpdateCartQty(item.cartKey, -1)} className="w-6 h-6 bg-white border rounded font-bold">-</button>
                            <span className="w-5 text-center font-bold">{item.quantity}</span>
                            <button onClick={() => handleUpdateCartQty(item.cartKey, 1)} className="w-6 h-6 bg-white border rounded font-bold">+</button>
                            <button onClick={() => handleRemoveCartItem(item.cartKey)} className="text-red-500 ml-1 font-bold">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                  {cart.length > 0 && (
                    <div className="border-t pt-4 space-y-2">
                      <div className="flex justify-between font-bold text-sm">
                        <span>{lang === 'en' ? 'Total:' : 'মোট:'}</span>
                        <span>৳{subtotal}</span>
                      </div>
                      <button onClick={() => { setIsCartOpen(false); setView('checkout'); }} className="w-full bg-theme-navy text-white py-3 rounded-xl font-bold uppercase tracking-wider">
                        {lang === 'en' ? 'Checkout & Order' : 'চেকআউট ও অর্ডার'}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          <footer className="bg-gradient-to-b from-[#091524] via-[#060E18] to-[#03070D] text-slate-400 text-xs pt-12 pb-8 mt-12 sm:mt-16 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8 pb-8 border-b border-slate-800">
              <div className="space-y-2">
                <h3 className="font-sport text-xl font-bold text-white">JERSEY ADDA</h3>
                <p>
                  {lang === 'en' 
                    ? 'One of Bangladesh’s leading authentic football jersey stores. Premium Thai polyester fabrics, Player Edition and Retro Classics kits.' 
                    : 'বাংলাদেশের অন্যতম সেরা স্পোর্টস জার্সি স্টোর। প্রিমিয়াম থাই ফেব্রিক, প্লেয়ার এডিশন ও রেট্রো কালেকশনের নির্ভরযোগ্য ঠিকানা।'}
                </p>
                <span className="inline-block text-[10px] text-sky-400 font-mono">⚡ WHERE FOOTBALL MEETS PASSION</span>
              </div>
              <div className="space-y-2">
                <h4 className="font-bold text-white uppercase">Atelier Guarantee</h4>
                <p>🛡️ {lang === 'en' ? '100% Authentic Thai Polyester Fabric' : '১০০% অথেনটিক থাই পলিয়েস্টার ফেব্রিক'}</p>
                <p className="text-sky-300">🚚 {lang === 'en' ? 'Dhaka 24-48h | Outside Dhaka 24-72h' : 'ঢাকার ভেতরে ২৪-৪৮ ঘণ্টা | বাইরে ২৪-৭২ ঘণ্টা'}</p>
                <p>🔄 {lang === 'en' ? 'Easy Size Exchange (S - XXL)' : 'সহজ সাইজ এক্সচেঞ্জ সুবিধা (S - XXL)'}</p>
              </div>
              <div className="space-y-2">
                <h4 className="font-bold text-white uppercase">{lang === 'en' ? 'Helpline & Payment' : 'হেল্পলাইন ও পেমেন্ট'}</h4>
                <div className="bg-white/5 p-2.5 rounded-xl border border-white/10 flex justify-between items-center">
                  <span>{lang === 'en' ? 'Payment:' : 'পেমেন্ট:'} <strong>{PAYMENT_NUMBER}</strong></span>
                  <button onClick={() => { navigator.clipboard.writeText(PAYMENT_NUMBER); showToast(lang === 'en' ? 'Number copied!' : 'নম্বর কপি হয়েছে!'); }} className="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded font-bold">Copy</button>
                </div>
                <a href={`https://wa.me/${OWNER_WHATSAPP_NUMBER}`} target="_blank" className="block text-center bg-emerald-600 text-white py-2 rounded-xl font-bold">💬 WhatsApp: {DISPLAY_WHATSAPP}</a>
              </div>
            </div>
            <div className="max-w-7xl mx-auto px-4 pt-6 text-center text-[10px] text-slate-500">
              <p onDoubleClick={() => setShowAdminLoginModal(true)} className="cursor-pointer">© 2026 JERSEY ADDA ATELIER • ALL RIGHTS RESERVED.</p>
            </div>
          </footer>

          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-[#071322]/95 backdrop-blur-xl border-t border-white/15 px-3 py-2 flex justify-around items-center text-slate-400 safe-bottom shadow-2xl">
            <button onClick={() => { setView('home'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`flex flex-col items-center gap-0.5 transition ${view === 'home' ? 'text-sky-400 font-bold' : 'hover:text-white'}`}>
              <span className="text-base">🏠</span>
              <span className="text-[10px] uppercase font-bold tracking-wider">{lang === 'en' ? 'Home' : 'হোম'}</span>
            </button>

            <button onClick={() => { if (view !== 'home') setView('home'); setIsMobileSearchOpen(true); window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => mobileSearchInputRef.current?.focus(), 150); }} className="flex flex-col items-center gap-0.5 hover:text-white transition">
              <span className="text-base">🔍</span>
              <span className="text-[10px] uppercase font-bold tracking-wider">{lang === 'en' ? 'Search' : 'সার্চ'}</span>
            </button>

            <button onClick={() => setIsCartOpen(true)} className="flex flex-col items-center relative -top-3">
              <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-sky-500 to-sky-400 text-white flex items-center justify-center text-lg shadow-lg shadow-sky-500/40 border-2 border-[#071322]">
                🛒
                {cartCount > 0 && (
                  <span className="absolute -top-1 -right-1 bg-emerald-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-2 border-[#071322]">
                    {cartCount}
                  </span>
                )}
              </div>
              <span className="text-[10px] uppercase font-bold tracking-wider text-slate-300 mt-0.5">{lang === 'en' ? 'Bag' : 'ব্যাগ'}</span>
            </button>

            <button onClick={() => { setView('profile'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`flex flex-col items-center gap-0.5 transition ${view === 'profile' ? 'text-sky-400 font-bold' : 'hover:text-white'}`}>
              <span className="text-base">👤</span>
              <span className="text-[10px] uppercase font-bold tracking-wider">{lang === 'en' ? 'Profile' : 'প্রোফাইল'}</span>
            </button>

            <a href={`https://wa.me/${OWNER_WHATSAPP_NUMBER}`} target="_blank" rel="noreferrer" className="flex flex-col items-center gap-0.5 text-emerald-400 hover:text-emerald-300 transition">
              <span className="text-base">💬</span>
              <span className="text-[10px] uppercase font-bold tracking-wider">WhatsApp</span>
            </a>
          </nav>
        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) ReactDOM.createRoot(rootElement).render(<App />);
    } catch (err) {}
  </script>
</body>
</html>
